<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1 class="display-1 text-center text-bg-warning">Lost: My Soul</h1>
        <p class="text-center">I don't use it very much but I would still like to have it back</p>
        <p class="text-center">$500 reward if found</p>
        <p class="text-center">Last seen Nov 3 2025 at 4351 Broadway Oakland, California</p>
        <br>
        <div class="carousel slide w-50">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="41688-wisp-spirit.jpg" class="d-block w-100 rounded" alt="wisp">
                </div>
                <div class="carousel-item">
                    <img src="Ben_Howell_ghost.webp" class="d-block w-100 rounded" alt="ghost">
                </div>
                <div class="carousel-item">
                    <img src="58997-ghoul.jpg" class="d-block w-100 rounded" alt="ghoul">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
