<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face</title>
    <style>
        .face{
            background-color: yellow; 
            width: 300px; 
            height: 500px;
        }
        .whites{
            background-color: white;
            width:100px;
            height:150px;
            position: absolute;
        }
        .pupils{
            background-color: black;
            width:50px;
            height:70px;
            margin:20px;
            position: absolute;
        }
        .mouth{
            background-color: black;
            width:350px;
            height: 300px;
            position: absolute;
        }
        .teeth{
            background-color: white;
            width: 40px;
            height: 40px;
            position: absolute;
        }
        .tongue{
            background-color: red;
            width: 125px;
            height: 100px;
            position: absolute;
        }
        .slit{
            background-color: black;
            width: 10px;
            height: 80px;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="face"></div>
    <div class="whites" style="top: 30px; left: 25px;">
        <div class="pupils"></div>
    </div>
    <div class="whites" style="top: 30px; left: 140px;">
        <div class="pupils"></div>
    </div>
</body>
</html>
