<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character descriptor</title>
</head>
<body>
    <h1>Character Form</h1>
    <h3>Describe your character below</h3>
    <p><em><a href="ass_1.10_bio.html">My bio</a></em></p>
    <br>
    <label for="name">Your name:</label>
    <input type="text" id="name" name="name" placeholder="Your name here">
    <br>
    <label for="charname">Character's name:</label>
    <input type="text" id="charname" name="character name" placeholder="ex: Ashling Witchchild">
    <br>
    <label for="race">Race:</label>
    <select id="race" name="character race">
        <option value="human">Human</option>
        <option value="high elf">High Elf</option>
        <option value="wood elf">Wood Elf</option>
        <option value="drow">Drow</option>
        <option value="hill dwarf">Hill Dwarf</option>
        <option value="mountain dwarf">Mountain Dwarf</option>
        <option value="forest gnome">Forest Gnome</option>
        <option value="rock gnome">Rock Gnome</option>
        <option value="half-elf">Half-Elf</option>
        <option value="half-orc">Half-Orc</option>
        <option value="halfling">Halfling</option>
        <option value="tiefling">Tiefling</option>
        <option value="dragonborn">Dragonborn</option>
    </select>
    <br>
    <p>Class: <br>
    <label for="barbarian">Barbarian</label>
    <input type="radio" id="barbarian" name="character class" value="barbarian"><br>
    <label for="bard">Bard</label>
    <input type="radio" id="bard" name="character class" value="bard"><br>
    <label for="cleric">Cleric</label>
    <input type="radio" id="cleric" name="character class" value="cleric"><br>
    <label for="druid">Druid</label>
    <input type="radio" id="druid" name="character class" value="druid"><br>
    <label for="fighter">Fighter</label>
    <input type="radio" id="fighter" name="character class" value="fighter"><br>
    <label for="monk">Monk</label>
    <input type="radio" id="monk" name="character class" value="monk"><br>
    <label for="paladin">Paladin</label>
    <input type="radio" id="paladin" name="character class" value="paladin"><br>
    <label for="ranger">Ranger</label>
    <input type="radio" id="ranger" name="character class" value="ranger"><br>
    <label for="rogue">Rogue</label>
    <input type="radio" id="rogue" name="character class" value="rogue"><br>
    <label for="sorcerer">Sorcerer</label>
    <input type="radio" id="sorcerer" name="character class" value="sorcerer"><br>
    <label for="warlock">Warlock</label>
    <input type="radio" id="warlock" name="character class" value="warlock"><br>
    <label for="wizard">Wizard</label>
    <input type="radio" id="wizard" name="character class" value="wizard"><br>
    </p>
    <p>Please quickly describe your character's backstory:</p>
    <textarea id="backstory" name="backstory" cols="20" rows="15"></textarea>
    <p></p>
    <input type="submit" name="is submitted" placeholder="Submit">


</body>
</html>
