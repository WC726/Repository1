<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puppies!</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>
    <h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
    <p>Please note: First Name, Last Name, Password, and Email are required</p>
    <form>
        <p>
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" name="first name" placeholder="First Name">
        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" name="last name" placeholder="Last Name">
        </p>
        <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="name@email.com">
        <label for="pawsword">Password:</label>
        <input type="password" id="pawsword" name="password" value="">
        </p>
        <p>
        <fieldset>
        <legend>Are you over the age of 18?</legend>
        <div>
        <input type="radio" id="yes" name="islegalage" value="yes" />
        <label for="yes">Yes</label>
        </div>
        <div>
        <input type="radio" id="no" name="islegalage" value="no" />
        <label for="no">No</label>
        </div>
        </fieldset>
        </p>
        <p>
        <label for="paymenttype">Do you have a Credit Card or PayPal?</label>
        <select id="paymenttype" name="payment type">
            <option value="Credit Card">Credit Card</option>
            <option value="PayPal">PayPal</option>
        </select>
        </p>
        <input type="submit" name="submit" placeholder="Submit Feedback">
    </form>
</body>
</html>
