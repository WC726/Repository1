<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alignment Chart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1 class="text-center">Alignment Chart</h1>
    <div class="container text-center">
        <div class="row">
            <div class="col border border-dark">
                <img src="redtornado.png" alt="red tornado">
                <br>
                Lawful Good
            </div>
            <div class="col border border-dark">
                <img src="cassiesandsmark.png" alt="wonder girl" class="">
                <br>
                Neutral Good
            </div>
            <div class="col border border-dark">
                <img src="cissiekingjones.png" alt="arrowette" class="">
                <br>
                Chaotic Good
            </div>
        </div>
        <div class="row">
            <div class="col border border-dark">
                <img src="anitafite.png" alt="empress">
                <br>
                Lawful Neutral
            </div>
            <div class="col border border-dark">
                <img src="bartallen.png" alt="impulse" class="">
                <br>
                True Neutral
            </div>
            <div class="col border border-dark">
                <img src="konelkent.png" alt="superboy" class="">
                <br>
                Chaotic Neutral
            </div>
        </div>
        <div class="row">
            <div class="col border border-dark">
                <img src="timdrake.png" alt="robin 3">
                <br>
                Lawful Evil
            </div>
            <div class="col border border-dark">
                <img src="secret.png" alt="secret" class="">
                <br>
                Neutral Evil
            </div>
            <div class="col border border-dark">
                <img src="slobo.png" alt="slobo">
                <br>
                Chaotic Evil
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
